# Servidor de la web (Cloudflare Worker): avisos push y formulario de contacto.
# Cómo desplegarlo: mira la sección "Avisos en el móvil" del README.
name = "eventos-metropolitano-avisos"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Webs que pueden suscribirse (separadas por comas, sin barra final)
ALLOWED_ORIGINS = "https://eventosmadridmetropolitano.es,https://www.eventosmadridmetropolitano.es"

# Formulario de contacto: el correo sale del buzón de la web por SMTP.
# Pon el servidor de salida (SMTP) que te da tu proveedor de correo. Puerto 465 (SSL) o 587 (STARTTLS).
# El usuario y la contraseña del buzón son secretos: `npx wrangler secret put SMTP_USUARIO` y `... SMTP_CLAVE`.
SMTP_HOST = ""
SMTP_PUERTO = "465"
CONTACTO_DESTINO = "contacto@eventosmadridmetropolitano.es"

# Base de datos donde se guardan las suscripciones.
# Crea la tuya con `npx wrangler kv namespace create SUSCRIPCIONES` y pega aquí el id que te dé.
# (El id no es secreto: sin tu cuenta de Cloudflare no sirve para nada.)
[[kv_namespaces]]
binding = "SUSCRIPCIONES"
id = "PEGA_AQUI_EL_ID"
