# Robot que actualiza los eventos y publica la web.
# Se ejecuta: cada día a las 10:00 (hora de Madrid), cuando se sube un cambio,
# o a mano desde la pestaña "Actions".
name: Actualizar eventos y publicar web

on:
  # GitHub usa hora UTC y no cambia al horario de verano. Las 10:00 de Madrid son
  # las 09:00 UTC en invierno y las 08:00 UTC en verano: se programan las dos y el
  # paso "hora" deja seguir solo la que corresponde.
  schedule:
    - cron: "0 8 * * *"    # 10:00 en Madrid en verano
    - cron: "0 9 * * *"    # 10:00 en Madrid en invierno
  push:
    branches: [main]
  workflow_dispatch:       # permite lanzarlo a mano con un botón
    inputs:
      prueba:
        description: "Enviar un mensaje de prueba (email, WhatsApp, Telegram y avisos en el móvil)"
        type: boolean
        default: false

permissions:
  contents: write   # para guardar el eventos.json nuevo
  pages: write      # para publicar la web
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  # Decide si esta ejecución programada es la de las 10:00 en Madrid
  hora:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.comprobar.outputs.seguir }}
    steps:
      - id: comprobar
        run: |
          desfase=$(TZ=Europe/Madrid date +%z)   # +0100 en invierno, +0200 en verano
          programa="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" != "schedule" ] \
             || { [ "$programa" = "0 9 * * *" ] && [ "$desfase" = "+0100" ]; } \
             || { [ "$programa" = "0 8 * * *" ] && [ "$desfase" = "+0200" ]; }; then
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          else
            echo "No es la ejecución de las 10:00 en Madrid (desfase $desfase); se salta."
            echo "seguir=no" >> "$GITHUB_OUTPUT"
          fi

  actualizar:
    needs: hora
    if: needs.hora.outputs.seguir == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Recoger eventos
        run: python recoger_eventos.py

      - name: Guardar eventos.json y eventos.ics si han cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos.json eventos.ics
          git diff --staged --quiet || (git commit -m "Actualizar eventos" && git push)

      - name: Preparar la web
        env:
          TELEGRAM_CANAL: ${{ vars.TELEGRAM_CANAL }}
          PUSH_API: ${{ vars.PUSH_API }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          mkdir web
          cp -r index.html privacidad.html manifest.json sw.js iconos \
                eventos.json eventos.ics favicon.svg apple-touch-icon.png web/
          # config.json: datos públicos que lee la web (nunca secretos)
          python -c 'import json, os; print(json.dumps({"telegram": os.environ["TELEGRAM_CANAL"], "push_api": os.environ["PUSH_API"], "vapid": os.environ["VAPID_PUBLIC_KEY"]}))' > web/config.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publicar la web
        id: publicar
        uses: actions/deploy-pages@v4

      # Va al final: si falla el envío, la web ya está publicada igualmente.
      # Solo en la ejecución diaria o a mano: al subir cambios de código no se avisa
      # (si no, el recordatorio de "mañana" se repetiría con cada cambio).
      - name: Enviar avisos
        if: github.event_name != 'push'
        env:
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_CLAVE: ${{ secrets.EMAIL_CLAVE }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ vars.TELEGRAM_CANAL }}
          PUSH_API: ${{ vars.PUSH_API }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          WEB_URL: ${{ steps.publicar.outputs.page_url }}
        run: python avisar.py ${{ inputs.prueba && '--prueba' || '' }}
